<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Petualangan Melawan Raja Iblis — Modul Ajar Game RPG</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="landing backdrop">
  <main class="landing-main">
    <div class="mark anim-rise">
      <span class="mark-top">Petualangan Melawan</span>
      <span class="mark-main">Raja Iblis</span>
      <span class="mark-rule"><i></i></span>
    </div>
    <p class="landing-lead anim-rise" style="animation-delay:.15s">Kuis kelas bergaya RPG. Setiap siswa menjadi petualang, menjawab dari HP, dan bersama-sama menumbangkan pasukan Raja Iblis.</p>
    <div class="landing-actions anim-rise" style="animation-delay:.25s">
      <a class="btn btn-primary btn-big" href="/host"><i data-icon="sword"></i>Saya guru</a>
      <a class="btn btn-big" href="/play"><i data-icon="arrow"></i>Saya siswa</a>
    </div>
    <div class="landing-chars" id="chars"></div>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/shared/characters.js"></script>
  <script src="/js/sprites.js"></script>
  <script>
    (async function () {
      const wrap = document.getElementById('chars');
      const items = [];
      for (const c of GameData.CHARACTERS) {
        const cv = document.createElement('canvas');
        cv.width = 180; cv.height = 210; cv.title = c.name;
        const fig = document.createElement('figure');
        fig.style.setProperty('--c', c.color); fig.style.setProperty('--i', items.length);
        fig.append(cv);
        const cap = document.createElement('figcaption'); cap.textContent = c.name; fig.append(cap);
        wrap.append(fig);
        const a = new Sprites.Animator(c.id, c.fps); a.set('idle', true);
        items.push({ cv, a, id: c.id });
        Sprites.load(c.id);
      }
      let last = performance.now();
      (function loop(now) {
        const dt = (now - last) / 1000; last = now;
        for (const it of items) {
          it.a.update(dt);
          const s = Sprites.get(it.id); const ctx = it.cv.getContext('2d');
          ctx.clearRect(0, 0, 180, 210);
          if (s) Sprites.draw(ctx, s, 'idle', it.a.frame(), 90, 205, 170);
        }
        requestAnimationFrame(loop);
      })(last);
    })();
  </script>
</body>
</html>
